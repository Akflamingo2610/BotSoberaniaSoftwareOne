name: CD - Python API

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Ambiente alvo"
        required: true
        type: choice
        default: "staging"
        options:
          - dev
          - staging
          - prod
      publish_to_ghcr:
        description: "Publicar imagem no GHCR"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/python-api
          tags: |
            type=raw,value=${{ inputs.target_environment }}
            type=sha

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ inputs.publish_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ./python_api
          file: ./python_api/Dockerfile
          push: ${{ inputs.publish_to_ghcr }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export deployment metadata
        run: |
          mkdir -p out
          {
            echo "target_environment=${{ inputs.target_environment }}"
            echo "publish_to_ghcr=${{ inputs.publish_to_ghcr }}"
            echo "git_sha=${{ github.sha }}"
            echo "image_tags<<EOF"
            echo "${{ steps.meta.outputs.tags }}"
            echo "EOF"
          } > out/deployment-metadata.txt

      - name: Upload deployment metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-api-deployment-metadata
          path: out/deployment-metadata.txt

  lambda-package:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build Lambda package (SAM)
        working-directory: python_api
        run: |
          sam build --template-file template.lambda.yaml

      - name: Validate SAM template
        working-directory: python_api
        run: |
          sam validate --template-file template.lambda.yaml

      - name: Upload SAM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-api-lambda-sam-build
          path: python_api/.aws-sam/build
